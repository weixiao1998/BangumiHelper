[project]
name = "bangumi-helper"
version = "1.0.0"
description = "A modern bangumi tracking and downloading assistant"
authors = [{ name = "BangumiHelper Team" }]
readme = "README.md"
requires-python = ">=3.14,<4"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    "sqlalchemy==2.0.52",
    "aiomysql==0.3.2",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "email-validator==2.3.0",
    "python-jose[cryptography]==3.5.0",
    "bcrypt==5.0.0",
    "python-multipart==0.0.32",
    "aiohttp==3.14.3",
    "beautifulsoup4==4.15.0",
    "lxml==6.1.2",
    "feedparser==6.0.14",
    "feedgenerator==2.2.1",
    "qbittorrent-api==2026.8.1",
    "transmission-rpc==7.0.12",
    "loguru==0.7.3",
    "alembic==1.19.1",
    "apscheduler==3.11.3",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "ruff==0.16.4",
    "mypy==2.3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 120
target-version = "py314"
exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
