x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  backend:
    image: bangumi-helper-backend:latest
    build: ./backend
    container_name: bangumi-helper-backend
    restart: unless-stopped
    volumes:
      - bangumi-data:/app/data
      - ./.env:/app/.env:ro
    networks:
      - bangumi-network
    logging: *logging

  frontend:
    image: bangumi-helper-frontend:latest
    build: ./frontend
    container_name: bangumi-helper-frontend
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - caddy-data:/data
    depends_on:
      - backend
    networks:
      - bangumi-network
    logging: *logging

volumes:
  bangumi-data:
  caddy-data:

networks:
  bangumi-network:
    driver: bridge
